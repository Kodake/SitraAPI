# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - BackEnd20250606140343

on:
  push:
    branches:
      - clean-refactor
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish SITRA.API/SITRA.API.csproj -c Release -o ./publish-output

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'BackEnd20250606140343'
          slot-name: 'Production'
          package: ./publish-output
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_13E51F75876B4D4D8F6515EDE3B040CB }}